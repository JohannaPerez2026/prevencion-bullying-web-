<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Reporte Escolar</title>
    <link rel="stylesheet" href="linea.css">
</head>
<body>

<div class="form-container">
    <h2>Registro de Reporte Escolar</h2>
    
    <form id="bullyingForm" action="guardarReporte.php" method="POST">
        <div id="seccion-datos">
            <div class="form-group">
                <label for="nombre">Escribe tu nombre:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
            </div>
            
            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="1" max="100" required placeholder="Ejemplo: 14">
            </div>
            
            <div class="form-group">
                <label for="grupo">Grupo y Grado:</label>
                <input type="text" id="grupo" name="grupo" required placeholder="Ejemplo: 5E">
            </div>
            
            <button type="button" id="btnSiguiente">Siguiente</button>
        </div>

        <div id="seccion-problema" class="hidden">
            <div class="form-group">
                <label for="problema">Escribe tu problema:</label>
                <textarea id="problema" name="problema" required placeholder="Cuéntanos qué está pasando..."></textarea>
            </div>
            
            <button type="submit" id="btnEnviar">Enviar Reporte</button>

            <div class="helpline">
                <p><strong>¿Necesitas hablar con alguien ahora mismo?</strong></p>
                <p>Línea de ayuda confidencial: emergency services</p>
            </div>
        </div>
    </form>
</div>

<script src="linea.js"></script>
</body>
</html>
